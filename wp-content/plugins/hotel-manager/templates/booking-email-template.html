<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>New Booking Notification</title>
</head>

<body style="margin:0; padding:0; background-color:#f4f4f4; font-family: Arial, sans-serif;">

<div style="max-width:600px; margin:0 auto; background:#ffffff; border-radius:8px; overflow:hidden;">

    <!-- HEADER / LOGO -->
    <div style="background:#1a73e8; padding:20px; text-align:center;">
        <img src="{{logo_url}}" alt="Hotel Logo" style="max-width:150px; height:auto; margin-bottom:10px;">
        <h2 style="color:white; margin:0; font-size:22px;">New Booking Received</h2>
    </div>

    <!-- BODY -->
    <div style="padding:25px;">

        <p style="font-size:16px; color:#333333;">
            A new booking has been submitted. Below are the guest details:
        </p>

        <!-- BOOKING DETAILS TABLE -->
        <table style="width:100%; border-collapse:collapse; margin-top:15px;">
            <tr>
                <td style="padding:10px; border-bottom:1px solid #eeeeee; font-weight:bold;">Guest Name:</td>
                <td style="padding:10px; border-bottom:1px solid #eeeeee;">{{full_name}}</td>
            </tr>
            <tr>
                <td style="padding:10px; border-bottom:1px solid #eeeeee; font-weight:bold;">Phone:</td>
                <td style="padding:10px; border-bottom:1px solid #eeeeee;">{{phone}}</td>
            </tr>
            <tr>
                <td style="padding:10px; border-bottom:1px solid #eeeeee; font-weight:bold;">Email:</td>
                <td style="padding:10px; border-bottom:1px solid #eeeeee;">{{email}}</td>
            </tr>
            <tr>
                <td style="padding:10px; border-bottom:1px solid #eeeeee; font-weight:bold;">Hotel / Room:</td>
                <td style="padding:10px; border-bottom:1px solid #eeeeee;">{{hotel_name}}</td>
            </tr>
            <tr>
                <td style="padding:10px; border-bottom:1px solid #eeeeee; font-weight:bold;">Check-in:</td>
                <td style="padding:10px; border-bottom:1px solid #eeeeee;">{{check_in}}</td>
            </tr>
            <tr>
                <td style="padding:10px; border-bottom:1px solid #eeeeee; font-weight:bold;">Check-out:</td>
                <td style="padding:10px; border-bottom:1px solid #eeeeee;">{{check_out}}</td>
            </tr>
        </table>

        <!-- CALL TO ACTION -->
        <div style="text-align:center; margin-top:25px;">
            <a href="{{dashboard_link}}" 
               style="background:#1a73e8; color:#ffffff; padding:12px 25px; border-radius:5px; text-decoration:none; font-size:16px;">
                View Booking in Dashboard
            </a>
        </div>

    </div>

    <!-- FOOTER -->
    <div style="background:#f4f4f4; padding:15px; text-align:center; font-size:13px; color:#777777;">
        © {{year}} Your Hotel Name — All Rights Reserved.
    </div>

</div>

</body>
</html>
